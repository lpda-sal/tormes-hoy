# Single source of stable configuration. Secrets go in environment variables.
# Items marked VERIFY must be confirmed (see docs/review.md).

[app]
name = "Tormes Hoy"
short_name = "Tormes Hoy"

[location]
id = "salamanca"
name = "Salamanca"
lat = 40.95726767218838
lon = -5.638355587757416
timezone = "Europe/Madrid"

[openmeteo]
base_url = "https://api.open-meteo.com/v1/forecast"
forecast_days = 7

[aemet]
base_url = "https://opendata.aemet.es/opendata/api"
station_idema = "2870X"
municipality_code = "37274"
stale_after_hours = 3

[meteoblue]
base_url = "https://my.meteoblue.com/packages/basic-1h_basic-day"
refresh_every_hours = 6         # credit budget: see docs/sources.md
stale_after_hours = 12

[river]
flow_caution_m3s = 30.0
flow_danger_m3s = 50.0
station = "EA087"               # CHD gauging station, Tormes at Salamanca
current_url = "https://www.saihduero.es/risr/EA087" # SAIH Duero station page
station_field = "codigo"        # VERIFY: field names in that JSON
level_field = "nivel"
flow_field = "caudal"
time_field = "fecha"
observed_days = 30
daily_years = 2                 # daily history: current + previous year
stale_after_hours = 3
# Flow now vs yesterday's mean: a change must exceed the larger of both.
trend_flow_ratio = 0.15         # fraction of yesterday's mean flow
trend_flow_min_m3s = 3.0        # absolute floor; dominates below 20 m3/s

[yearbook]
years = 10
smoothing_window_days = 0       # compare the same calendar day only
level_shift_threshold_m = 0.15  # yearly median jump flagged as datum shift

[uv]
protection_threshold = 3

[output]
data_dir = "data"
