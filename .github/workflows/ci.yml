# Quality checks on code changes only (data commits are ignored).
name: ci

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ["data/**", "docs/**", "**.md"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy .
      - run: pytest -q
