[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tormes-hoy"
version = "0.1.0"
description = "Data collector for the Tormes Hoy dashboard (weather, UV, river)."
readme = "README.md"
requires-python = ">=3.12"
# Runtime uses the standard library only: the hourly GitHub Actions job
# needs no dependency installation, which keeps it fast.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10"]

[tool.setuptools.packages.find]
include = ["tormes_hoy*"]

[tool.setuptools.package-data]
tormes_hoy = ["config.toml"]

[tool.ruff]
line-length = 79
target-version = "py312"
extend-exclude = ["_site"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "PTH", "BLE"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["_site/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
